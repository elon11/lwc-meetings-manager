<template>
    <lightning-card title="Create Meeting">

        <!-- MEETING FORM -->
        <template if:true={showForm}>
            <lightning-record-form object-api-name="Meeting__c" layout-type="Full" mode="edit" onsubmit={handleSubmit}
                onsuccess={handleSuccess}>
            </lightning-record-form>
        </template>

        <!-- ATTENDEES SECTION -->
        <template if:true={showAttendees}>
            <div class="slds-p-around_medium">

                <h2 class="slds-text-heading_medium slds-m-bottom_small">
                    Select Attendees
                </h2>

                <!-- Search -->
                <lightning-input label="Search Contacts" placeholder="Type name..." onchange={handleSearch}>
                </lightning-input>

                <!-- Dual List -->
                <lightning-dual-listbox name="contacts" label="Contacts" source-label="Available"
                    selected-label="Selected" options={contactOptions} value={selectedContacts} onchange={handleSelect}>
                </lightning-dual-listbox>

                <!-- ACTION BUTTON -->
                <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                    <lightning-button label="Add Attendees" variant="brand" onclick={saveAttendees}>
                    </lightning-button>
                </div>

            </div>
        </template>

    </lightning-card>
</template>

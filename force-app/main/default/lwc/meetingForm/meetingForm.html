<template>
    <lightning-card title="Create New Meeting">

        <!-- MEETING FORM -->
        <template if:true={showForm}>
            <lightning-record-form object-api-name="Meeting__c" layout-type="Full" mode="edit" onsubmit={handleSubmit}
                onsuccess={handleSuccess}>
            </lightning-record-form>
        </template>

        <!-- ATTENDEES SECTION -->
        <template if:true={showAttendees}>
            <div class="slds-p-around_medium">

                <h2 class="slds-text-heading_medium">Select Attendees</h2>

                <!-- Search -->
                <lightning-input label="Search Contacts" placeholder="Type name..." onchange={handleSearch}>
                </lightning-input>

                <!-- Multi-Select -->
                <lightning-dual-listbox name="contacts" label="Contacts" source-label="Available"
                    selected-label="Selected" options={contactOptions} value={selectedContacts} onchange={handleSelect}>
                </lightning-dual-listbox>

                <lightning-button class="slds-m-top_small" label="Add Attendees" variant="brand"
                    onclick={saveAttendees}>
                </lightning-button>

            </div>
        </template>

    </lightning-card>
</template>
